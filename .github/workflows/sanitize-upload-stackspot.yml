name: Sanitize and Upload to StackSpot

on:
  workflow_call:
    inputs:
      ks-slug:
        required: true
        type: string
      docs-path:
        required: false
        type: string
        default: 'docs'
      use-mock:
        required: false
        type: boolean
        default: true
      stackspot-realm:
        required: false
        type: string
        default: ''
    secrets:
      STACKSPOT_CLIENT_ID:
        required: true
      STACKSPOT_CLIENT_SECRET:
        required: true
      DOCS_WORKFLOWS_TOKEN:
        required: true

jobs:
  sanitize-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do módulo (docs)
        uses: actions/checkout@v4
        with:
          path: module-docs

      - name: Checkout do repo de scripts
        uses: actions/checkout@v4
        with:
          repository: rafaelcrz/docs-workflows
          token: ${{ secrets.DOCS_WORKFLOWS_TOKEN }}
          path: scripts-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci
        working-directory: scripts-repo

      - name: Build do Docusaurus
        run: |
          npm ci
          npm run build
        working-directory: module-docs

      - name: Subir mock do StackSpot
        if: ${{ inputs.use-mock }}
        run: |
          node scripts-repo/mock-server/server.js > mock-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:4010 && exit 0
            sleep 0.5
          done
          echo "Mock do StackSpot não subiu"; cat mock-server.log; exit 1

      - name: Sanitizar e enviar ao StackSpot
        run: |
          if [ "${{ inputs.use-mock }}" = "true" ]; then
            export STACKSPOT_IDM_URL=http://localhost:4010
            export STACKSPOT_API_URL=http://localhost:4010
            export STACKSPOT_POLL_INTERVAL_MS=500
            export STACKSPOT_REALM="${STACKSPOT_REALM:-mock}"
          fi
          node scripts-repo/scripts/sanitize-and-upload.js \
            --path "${{ github.workspace }}/module-docs/${{ inputs.docs-path }}" \
            --build-path "${{ github.workspace }}/module-docs/build" \
            --publish
        env:
          KS_SLUG: ${{ inputs.ks-slug }}
          STACKSPOT_REALM: ${{ inputs.stackspot-realm }}
          STACKSPOT_CLIENT_ID: ${{ secrets.STACKSPOT_CLIENT_ID }}
          STACKSPOT_CLIENT_SECRET: ${{ secrets.STACKSPOT_CLIENT_SECRET }}

      - name: Log do mock do StackSpot
        if: ${{ always() && inputs.use-mock }}
        run: cat mock-server.log
