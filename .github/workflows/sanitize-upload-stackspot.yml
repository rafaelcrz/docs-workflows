name: Sanitize and Upload to StackSpot

on:
  workflow_call:
    inputs:
      ks-slug:
        required: true
        type: string
      docs-path:
        required: false
        type: string
        default: 'docs'
    secrets:
      STACKSPOT_CLIENT_ID:
        required: true
      STACKSPOT_CLIENT_SECRET:
        required: true
      DOCS_WORKFLOWS_TOKEN:
        required: true

jobs:
  sanitize-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do módulo (docs)
        uses: actions/checkout@v4
        with:
          path: module-docs

      - name: Checkout do repo de scripts
        uses: actions/checkout@v4
        with:
          repository: rafaelcrz/docs-workflows
          token: ${{ secrets.DOCS_WORKFLOWS_TOKEN }}
          path: scripts-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci
        working-directory: scripts-repo

      - name: Build do Docusaurus
        run: |
          npm ci
          npm run build
        working-directory: module-docs

      - name: Sanitizar e enviar ao StackSpot
        run: node scripts-repo/scripts/sanitize-and-upload.js --path "${{ github.workspace }}/module-docs/${{ inputs.docs-path }}" --build-path "${{ github.workspace }}/module-docs/build"
        env:
          KS_SLUG: ${{ inputs.ks-slug }}
          STACKSPOT_CLIENT_ID: ${{ secrets.STACKSPOT_CLIENT_ID }}
          STACKSPOT_CLIENT_SECRET: ${{ secrets.STACKSPOT_CLIENT_SECRET }}